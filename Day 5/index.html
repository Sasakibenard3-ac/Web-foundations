<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
</head>
<body>

    <header>
        <h1>User Directory</h1>
        <p>Load and filter users from a REST API.</p>
    </header>

    <main>
        <button id="load-users">Load Users</button>

        <div>
            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Type a name..."
            >
        </div>

        <p id="status">Click "Load Users" to load the users.</p>

        <ul id="users-list"></ul>
    </main>

    <script src="users.js" defer></script>
</body>
</html>
